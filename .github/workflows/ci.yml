name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker build --target sdk -t sdk .
      - name: Format (added files)
        run: ci/check.sh format
      - name: No new analyzer issues
        run: ci/check.sh analyze
      - name: Duplicate code (added files)
        run: ci/check.sh duplicates
      - name: Build
        run: docker build .
